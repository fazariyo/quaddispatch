name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # Served from https://fazariyo.github.io/quaddispatch, so every asset
          # and canonical URL carries the /quaddispatch prefix.
          NEXT_PUBLIC_BASE_PATH: /quaddispatch
          NEXT_PUBLIC_SITE_URL: https://fazariyo.github.io/quaddispatch
          # Settings > Secrets and variables > Actions > Variables.
          # Without it the forms render but refuse to send.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
        run: npm run build

      # enablement turns Pages on (source: GitHub Actions) the first time this
      # runs, so the repo needs no manual setup in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
